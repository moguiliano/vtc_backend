security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Admin
                property: email
        # Comptes des abonnés (D-074) : séparés des administrateurs (D-078, verrou n°1)
        abonne_provider:
            entity:
                class: App\Entity\CompteAbonne
                property: email

    role_hierarchy:
        ROLE_SUPER_ADMIN:
            - ROLE_ADMIN
            - ROLE_RESERVATIONS_VIEW
            - ROLE_RESERVATIONS_EDIT
            - ROLE_RESERVATIONS_DELETE
            - ROLE_FORFAITS_VIEW
            - ROLE_FORFAITS_EDIT
            - ROLE_VEHICULES_VIEW
            - ROLE_VEHICULES_EDIT
        ROLE_ADMIN:
            - ROLE_REGULATEUR
        ROLE_REGULATEUR:
            - ROLE_RESERVATIONS_VIEW
            - ROLE_RESERVATIONS_EDIT

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        # Espace abonnés (D-076) : sa propre porte, ses propres comptes.
        # Un compte abonné n'existe que derrière ce pare-feu ; un admin ne peut pas s'y connecter.
        espace:
            pattern: ^/espace(/|$)
            lazy: true
            provider: abonne_provider
            form_login:
                login_path: espace_connexion
                check_path: espace_connexion
                default_target_path: espace_accueil
                enable_csrf: true
            logout:
                path: espace_deconnexion
                target: espace_connexion
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: admin
                always_use_default_target_path: false
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/espace/(connexion|inscription)$, roles: PUBLIC_ACCESS }
        - { path: ^/espace(/|$), roles: ROLE_ABONNE }
        - { path: ^/admin, roles: [ROLE_ADMIN, ROLE_REGULATEUR] }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
